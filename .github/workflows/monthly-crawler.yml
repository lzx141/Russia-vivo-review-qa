name: Monthly Crawler Pipeline

on:
  schedule:
    # 每月3日 00:00 UTC（北京时间 08:00）自动运行
    - cron: "0 0 3 * *"
  workflow_dispatch:
    # 支持手动触发，便于测试
    inputs:
      start_date:
        description: "开始日期 YYYY-MM-DD（默认上月1日）"
        required: false
        type: string
      end_date:
        description: "结束日期 YYYY-MM-DD（默认上月最后一天）"
        required: false
        type: string

jobs:
  crawl:
    name: Crawl & Process Data
    # 固定镜像，避免 ubuntu-latest 切换导致浏览器环境漂移。
    # 浏览器保持有头模式，由 Xvfb 提供虚拟显示器。
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify headed browser runtime
        run: |
          set -euxo pipefail
          google-chrome --version
          chromedriver --version
          command -v xvfb-run

      - name: Smoke test headed Selenium through Xvfb
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          timeout 90s xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension RANDR" python -c "
          from src.crawler.ozon_crawler import _create_driver

          driver = _create_driver(headless=False)
          try:
              driver.set_page_load_timeout(15)
              driver.get('data:text/html,<title>Selenium Smoke</title><h1>ok</h1>')
              assert driver.title == 'Selenium Smoke', driver.title
              driver.save_screenshot('artifacts/selenium-smoke.png')
              print('Headed Selenium smoke test passed')
          finally:
              driver.quit()
          "

      - name: Determine date range
        id: dates
        run: |
          python -c "
          from datetime import date
          import sys
          start = '${{ github.event.inputs.start_date }}'
          end = '${{ github.event.inputs.end_date }}'
          today = date.today()
          first = today.replace(day=1)
          prev_end = first.fromordinal(first.toordinal() - 1)
          prev_start = prev_end.replace(day=1)
          start = start or prev_start.isoformat()
          end = end or prev_end.isoformat()
          print(f'start={start}')
          print(f'end={end}')
          " | tee -a "$GITHUB_ENV"

      - name: Run Wildberries crawler
        run: |
          set -euxo pipefail
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from src.crawler.wildberries_crawler import crawl_from_excel
          crawl_from_excel('Rusisa_new_20260130_all.xlsx', start_date='${{ env.start }}', end_date='${{ env.end }}')
          "

      - name: Run headed OZON crawler through Xvfb
        id: ozon
        continue-on-error: true
        run: |
          set -euxo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension RANDR" python -c "
          import sys
          sys.path.insert(0, '.')
          from src.crawler.ozon_crawler import crawl_from_excel
          crawl_from_excel('Rusisa_new_20260130_all.xlsx', start_date='${{ env.start }}', end_date='${{ env.end }}')
          "

      - name: Incremental translation (DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            python src/translation/translate_deepseek.py --dry-run
            python src/translation/translate_deepseek.py || echo "translation had issues"
          else
            echo "⚠️ No DEEPSEEK_API_KEY secret configured, skipping translation"
          fi

      - name: Require target-month data before commit
        run: |
          set -euxo pipefail
          python -c "
          import pandas as pd

          start = pd.Timestamp('${{ env.start }}')
          end = pd.Timestamp('${{ env.end }}') + pd.Timedelta(days=1) - pd.Timedelta(microseconds=1)
          df = pd.read_csv('merged_data_translated.csv', encoding='utf-8', low_memory=False)
          dates = pd.to_datetime(df['publishDate'], errors='coerce')
          count = int(dates.between(start, end).sum())
          latest = dates.max()
          print(f'Target range: {start.date()} through {end.date()}')
          print(f'Target-month records: {count}')
          print(f'Latest publishDate: {latest}')
          if count == 0:
              raise SystemExit('Freshness gate failed: target month has 0 records')
          "

      - name: Load data into local SQLite (validation)
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('merged_data_translated.csv', encoding='utf-8')
          print(f'总记录数: {len(df)}')
          print('评论:', (df['data_type']=='review').sum(), '问答:', (df['data_type']=='qa').sum())
          "

      - name: Commit and push data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # 运行时 Excel 和诊断截图不入库，只提交可部署的合并数据。
          git add -f merged_data_translated.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: 月度数据自动更新 $(date +%Y%m%d)"
            # 先拉取远程最新代码（rebase），避免非快进更新冲突
            for i in 1 2 3; do
              git pull --rebase origin main 2>&1 || true
              if git push origin main 2>&1; then
                echo "✅ 数据已推送，触发服务器 webhook 自动部署"
                break
              fi
              echo "⚠️ push 失败，第 ${i} 次重试..."
              sleep 5
            done
          else
            echo "ℹ️ 没有数据变化，跳过提交"
          fi

      - name: Summary
        if: always()
        run: |
          echo "============ 月度爬取完成 ============"
          echo "日期范围: ${{ env.start }} ~ ${{ env.end }}"
          echo "OZON 步骤结果: ${{ steps.ozon.outcome }}"
          echo "Workflow 由调度（每月3日）或手动触发"
          echo "======================================="

      - name: Report incomplete OZON source
        if: steps.ozon.outcome == 'failure'
        run: |
          echo "OZON 数据未完成：托管 runner 的网络出口被 OZON 拦截。"
          echo "Wildberries 数据已在前面的步骤完成合并和提交。"
          exit 1

      - name: Upload Selenium diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

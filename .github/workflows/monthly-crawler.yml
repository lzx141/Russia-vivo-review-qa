name: Monthly Crawler Pipeline

on:
  schedule:
    # 每月3日 00:00 UTC（北京时间 08:00）自动运行
    - cron: "0 0 3 * *"
  workflow_dispatch:
    # 支持手动触发，便于测试
    inputs:
      start_date:
        description: "开始日期 YYYY-MM-DD（默认上月1日）"
        required: false
        type: string
      end_date:
        description: "结束日期 YYYY-MM-DD（默认上月最后一天）"
        required: false
        type: string

jobs:
  crawl:
    name: Crawl & Process Data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (for OZON Selenium crawler)
        run: |
          sudo apt-get update
          # 尝试多种安装方式，确保 chromium 可用
          sudo apt-get install -y chromium-browser chromium-driver 2>/dev/null || \
          sudo apt-get install -y chromium chromium-driver 2>/dev/null || \
          sudo apt-get install -y chromium-browser 2>/dev/null || true
          # 安装 selenium 所需 driver 管理
          pip install selenium
          echo "--- check ---"
          which chromium chromium-browser chromedriver 2>/dev/null || echo "chromium check done"

      - name: Determine date range
        id: dates
        run: |
          python -c "
          from datetime import date
          import sys
          start = '${{ github.event.inputs.start_date }}'
          end = '${{ github.event.inputs.end_date }}'
          today = date.today()
          first = today.replace(day=1)
          prev_end = first.fromordinal(first.toordinal() - 1)
          prev_start = prev_end.replace(day=1)
          start = start or prev_start.isoformat()
          end = end or prev_end.isoformat()
          print(f'start={start}')
          print(f'end={end}')
          " | tee -a "$GITHUB_ENV"

      - name: Run Wildberries crawler
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from src.crawler.wildberries_crawler import crawl_from_excel
          crawl_from_excel('Rusisa_new_20260130_all.xlsx', start_date='${{ env.start }}', end_date='${{ env.end }}')
          " || echo "WB crawl had issues, continuing"

      - name: Run OZON crawler (with sort by time)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.crawler.ozon_crawler import crawl_from_excel
          crawl_from_excel('Rusisa_new_20260130_all.xlsx', start_date='${{ env.start }}', end_date='${{ env.end }}')
          " || echo "OZON crawl had issues, continuing"

      - name: Incremental translation (DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            python src/translation/translate_deepseek.py --dry-run
            python src/translation/translate_deepseek.py || echo "translation had issues"
          else
            echo "⚠️ No DEEPSEEK_API_KEY secret configured, skipping translation"
          fi

      - name: Load data into local SQLite (validation)
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('merged_data_translated.csv', encoding='utf-8')
          print(f'总记录数: {len(df)}')
          print('评论:', (df['data_type']=='review').sum(), '问答:', (df['data_type']=='qa').sum())
          "

      - name: Commit and push data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          # 仅提交有变化的文件（原始数据/、翻译CSV）
          if ! git diff --cached --quiet; then
            git commit -m "data: 月度数据自动更新 $(date +%Y%m%d)"
            git push origin main
            echo "✅ 数据已推送，触发服务器 webhook 自动部署"
          else
            echo "ℹ️ 没有数据变化，跳过提交"
          fi

      - name: Summary
        run: |
          echo "============ 月度爬取完成 ============"
          echo "日期范围: ${{ env.start }} ~ ${{ env.end }}"
          echo "Workflow 由调度（每月3日）或手动触发"
          echo "======================================="

# ==============================================================
# Nginx 配置 — GitHub Webhook 反向代理
#
# 将此文件放入 /etc/nginx/conf.d/ 或 sites-enabled/
# 然后在主 nginx.conf 的 server 块中添加：
#
#   include /path/to/this/file;
#
# 或直接在现有的 server 块中加入 location /webhook 段
# ==============================================================

# 方案一：集成到现有站点（推荐）
# 在您的 server {} 块中添加：
#
# location /webhook {
#     proxy_pass http://127.0.0.1:9000;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
# }
#
# location /webhook/health {
#     proxy_pass http://127.0.0.1:9000;
# }
#
# location /webhook/history {
#     proxy_pass http://127.0.0.1:9000;
# }

# 方案二：独立子域名（如 webhook.你的域名.com）
server {
    listen 443 ssl;
    server_name webhook.你的域名.com;

    ssl_certificate     /etc/nginx/ssl/你的域名.pem;
    ssl_certificate_key /etc/nginx/ssl/你的域名.key;

    # Webhook API 代理
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 较短的超时（webhook 响应很快）
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        # 允许大 payload（GitHub payload 可能较大）
        client_max_body_size 10M;
    }

    access_log /var/log/nginx/webhook_access.log;
    error_log  /var/log/nginx/webhook_error.log;
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name webhook.你的域名.com;
    return 301 https://$host$request_uri;
}
